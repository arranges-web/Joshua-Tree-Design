              schema: { $ref: "#/components/schemas/PermissionMatrixResponse" }

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadListResponse" }
    post:
      operationId: createLead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadWriteBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadResponse" }
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      parameters:
