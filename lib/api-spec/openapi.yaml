              schema: { $ref: "#/components/schemas/LeadResponse" }
  /leads/{id}/convert:
    post:
      operationId: convertLeadToQuote
      tags: [leads]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadConvertResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthUser:
      type: object
      required: [id, email, fullName, role, department]
      properties:
        id: { type: integer }
        email: { type: string }
        fullName: { type: string }
        role: { type: string }
        department: { type: string }
    AuthMeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }

    DashboardKpi:
      type: object
      required: [openJobs, scheduledJobs, completedThisMonth, pipelineCents, paidThisMonthCents, outstandingInvoicesCents, fleetActive, fleetInShop, employees]
      properties:
        openJobs: { type: integer }
        scheduledJobs: { type: integer }
        completedThisMonth: { type: integer }
        pipelineCents: { type: integer }
        paidThisMonthCents: { type: integer }
        outstandingInvoicesCents: { type: integer }
        fleetActive: { type: integer }
        fleetInShop: { type: integer }
        employees: { type: integer }
    DashboardJobByStatus:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }
    DashboardRecentJob:
      type: object
      required: [id, status, totalCents]
      properties:
        id: { type: integer }
        status: { type: string }
        totalCents: { type: integer }
        scheduledFor: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
    DashboardSummary:
      type: object
      required: [kpi, jobsByStatus, recentJobs, quotePipelineByStage]
      properties:
        kpi: { $ref: "#/components/schemas/DashboardKpi" }
        jobsByStatus:
          type: array
          items: { $ref: "#/components/schemas/DashboardJobByStatus" }
        quotePipelineByStage:
          type: array
          items: { $ref: "#/components/schemas/DashboardJobByStatus" }
        recentJobs:
          type: array
          items: { $ref: "#/components/schemas/DashboardRecentJob" }

    Customer:
      type: object
      required: [id, fullName, ownerUserId, createdAt]
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        billingAddress: { type: string, nullable: true }
        ownerUserId: { type: integer }
        createdAt: { type: string, format: date-time }
    CustomerWriteBody:
      type: object
      required: [fullName, ownerUserId]
      properties:
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        billingAddress: { type: string, nullable: true }
        ownerUserId: { type: integer }
    CustomerResponse:
      type: object
      required: [customer]
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
    CustomerListResponse:
      type: object
      required: [customers]
      properties:
        customers:
          type: array
          items: { $ref: "#/components/schemas/Customer" }

    Job:
      type: object
      required: [id, propertyId, status, totalCents, createdAt]
      properties:
        id: { type: integer }
        propertyId: { type: integer }
        crewId: { type: integer, nullable: true }
        status: { type: string }
        scheduledFor: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        totalCents: { type: integer }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    JobWriteBody:
      type: object
      required: [propertyId, status, totalCents]
      properties:
        propertyId: { type: integer }
        crewId: { type: integer, nullable: true }
        status: { type: string }
        scheduledFor: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        totalCents: { type: integer }
        notes: { type: string, nullable: true }
    JobResponse:
      type: object
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/Job" }
    JobListResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/Job" }

    Quote:
      type: object
      required: [id, customerId, ownerUserId, status, subtotalCents, totalCents, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        propertyId: { type: integer, nullable: true }
        ownerUserId: { type: integer }
        status: { type: string }
        subtotalCents: { type: integer }
        totalCents: { type: integer }
        sentAt: { type: string, format: date-time, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    QuoteWriteBody:
      type: object
      required: [customerId, ownerUserId, status, subtotalCents, totalCents]
      properties:
        customerId: { type: integer }
        propertyId: { type: integer, nullable: true }
        ownerUserId: { type: integer }
        status: { type: string }
        subtotalCents: { type: integer }
        totalCents: { type: integer }
        sentAt: { type: string, format: date-time, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
    QuoteResponse:
      type: object
      required: [quote]
      properties:
        quote: { $ref: "#/components/schemas/Quote" }
    QuoteListResponse:
      type: object
      required: [quotes]
      properties:
        quotes:
          type: array
          items: { $ref: "#/components/schemas/Quote" }

    Invoice:
      type: object
      required: [id, customerId, status, totalCents]
      properties:
        id: { type: integer }
        jobId: { type: integer, nullable: true }
        customerId: { type: integer }
        status: { type: string }
        totalCents: { type: integer }
        issuedAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
    InvoiceWriteBody:
      type: object
      required: [customerId, status, totalCents]
      properties:
        jobId: { type: integer, nullable: true }
        customerId: { type: integer }
        status: { type: string }
        totalCents: { type: integer }
        issuedAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
    InvoiceResponse:
      type: object
      required: [invoice]
      properties:
        invoice: { $ref: "#/components/schemas/Invoice" }
    InvoiceListResponse:
      type: object
      required: [invoices]
      properties:
        invoices:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }

    Truck:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer }
        name: { type: string }
        vin: { type: string, nullable: true }
        plate: { type: string, nullable: true }
        status: { type: string }
        assignedCrewId: { type: integer, nullable: true }
    TruckWriteBody:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        vin: { type: string, nullable: true }
        plate: { type: string, nullable: true }
        status: { type: string }
        assignedCrewId: { type: integer, nullable: true }
    TruckResponse:
      type: object
      required: [truck]
      properties:
        truck: { $ref: "#/components/schemas/Truck" }
    TruckListResponse:
      type: object
      required: [trucks]
      properties:
        trucks:
          type: array
