kind = "web"
previewPath = "/"
title = "Joshua Tree Inc."
version = "1.0.0"
id = "artifacts/joshua-tree"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18922

[services.development]
run = "pnpm --filter @workspace/joshua-tree run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/joshua-tree", "run", "build" ]
publicDir = "artifacts/joshua-tree/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18922"
BASE_PATH = "/"
